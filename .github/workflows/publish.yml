name: Publish to PyPI

# Manual on purpose. `word-mcp-semantic` is not on PyPI yet, and a workflow that
# fires automatically on every release would fail noisily until it is.
#
# One-time setup before the first run, on https://pypi.org/manage/account/publishing/
# (Trusted Publishing, so no long-lived API token is ever stored in this repository):
#
#   PyPI project name : word-mcp-semantic
#   Owner             : LePhilippeDucTai
#   Repository        : word-mcp-semantic
#   Workflow          : publish.yml
#   Environment       : pypi
#
# Then run this workflow from the Actions tab, picking the release tag to publish.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (for example v2.0.0)"
        required: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      # Trusted Publishing exchanges this short-lived OIDC token for a PyPI
      # upload credential. No secret to rotate, nothing to leak.
      id-token: write
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Check the distributions are well-formed
        run: uvx twine check dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
