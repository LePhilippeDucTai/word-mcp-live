[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "word-mcp-live"
version = "1.6.20"
description = "MCP server for Microsoft Word — live editing on Windows (COM) and macOS (JXA), plus cross-platform python-docx tools"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "GongRzhe", email = "gongrzhe@gmail.com"},
    {name = "Yüce Karapazar"}
]
keywords = ["mcp", "word", "docx", "microsoft-word", "document", "com-automation", "python-docx", "ai", "llm", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.2",
    "fastmcp>=2.8.1",
    "msoffcrypto-tool>=5.4.2",
    "docx2pdf>=0.1.8",
    "lxml>=5",
    "python-dotenv",
    "pywin32>=306; sys_platform == 'win32'",
    "Pillow>=10.0.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-timeout",
    "ruff",
]

[project.urls]
"Homepage" = "https://github.com/ykarapazar/word-mcp-live"
"Bug Tracker" = "https://github.com/ykarapazar/word-mcp-live/issues"
"Changelog" = "https://github.com/ykarapazar/word-mcp-live/blob/main/CHANGELOG.md"
"Documentation" = "https://github.com/ykarapazar/word-mcp-live#readme"

[tool.hatch.build.targets.wheel]
only-include = [
    "word_document_server",
    "office_word_mcp_server",
]
sources = ["."]

[project.scripts]
word_mcp_server = "word_document_server.main:run_server"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "libreoffice: requires a LibreOffice installation",
    "characterization: characterization tests pinning existing behavior",
]
timeout = 120

[tool.ruff]
target-version = "py311"
include = [
    "word_document_server/engine/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
]

[tool.ruff.lint]
# N999: the project root ships an __init__.py, so ruff treats the checkout
# directory name as the top-level package name; that name is not under our
# control (worktree/repo directory names contain dashes) and isn't a code
# quality issue.
ignore = ["N999"]
